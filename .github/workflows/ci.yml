name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Use the go.mod version: a newer Go than the one golangci-lint was
      # built with makes its type check fail on the standard library.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      # The clean-room e2e tests pull container images on first run.
      - run: go test -race -timeout 20m ./...

  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - run: go build -trimpath ./cmd/paranoid

  # The tool audits its own changes: pull requests against their base
  # branch, pushes to main against the commit the push started from.
  # Findings are triaged by a human, not suppressed, so the report
  # never gates the build here.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - run: go build -trimpath -o bin/paranoid ./cmd/paranoid
      - name: Verify these changes
        env:
          BASE_REF: ${{ github.base_ref }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            base="origin/${BASE_REF}"
          elif [ -n "${PUSH_BASE}" ] && git cat-file -e "${PUSH_BASE}" 2>/dev/null; then
            base="${PUSH_BASE}"
          elif git rev-parse --verify --quiet 'HEAD~1^{commit}' >/dev/null; then
            base="HEAD~1"
          else
            # First commit on the repository: there is nothing to diff against.
            echo "No base commit to compare against; skipping." | tee paranoid-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Comparing against ${base}"
          ./bin/paranoid verify --base "${base}" --sandbox none \
            --format md --output paranoid-report.md || true
          cat paranoid-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paranoid-report
          path: paranoid-report.md

  goreleaser-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          args: release --snapshot --clean
